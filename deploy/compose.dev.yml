# Nakładka lokalna (tylko różnice deweloperskie względem compose.yml):
#   pnpm --filter @parrot-social/parrot_web run build:dev  (wymagane przed --build, zob. parrot-web
#   poniżej; `build` (bez :dev) buduje z configuration=production, czyli z environment.prod.ts -
#   lokalny stos wołałby placeholder "parrotsocialapi" zamiast localhost:10710)
#   docker compose -f deploy/compose.yml -f deploy/compose.dev.yml --env-file .env up -d --build
# Budowanie odwzorowuje .github/steps/create_docker_image.sh (te same build-args).
# Lokalne buildy (docker build, pnpm) używają tych samych lokalnych rejestrów
# (ZOT/Verdaccio) co pipeline CI.

services:
  postgres:
    # internal: true nie publikuje portów - dopięcie do sieci default.
    networks:
      - default
    ports:
      - "127.0.0.1:${PARROT_DB_HOST_PORT:-10720}:5432"

  liquibase:
    networks:
      - default

  parrot-api:
    build:
      context: ..
      dockerfile: .github/docker/node.Dockerfile
      args:
        RUNTIME_VERSION: "24"
        PACKAGE_NAME: "@parrot-social/parrot_api"
        PROJECT_PATH: apps/parrot_api
        BUILD_OUTPUT: dist
        START_COMMAND: node dist/main.js
        APP_PORT: "10710"
    # PARROT_SEED_MEDIA_DIR + bind mount seed media są teraz w compose.yml
    # (kanoniczne, działa też na produkcji) - tu tylko nakładka portów.
    ports: !override
      - "127.0.0.1:${PARROT_API_HOST_PORT:-10710}:${PARROT_API_CONTAINER_PORT:-10710}"

  parrot-web:
    # Wymaga lokalnego builda przed `up --build`: pnpm --filter @parrot-social/parrot_web run build:dev
    # (unika pnpm install/supply-chain check w kontenerze - zob. angular.local.Dockerfile; build:dev
    # = configuration development, inaczej dist/ wskazywałby na placeholder środowiska produkcyjnego).
    build:
      context: ../apps/parrot_web
      dockerfile: ../../.github/docker/angular.local.Dockerfile
      args:
        BUILD_OUTPUT: dist/parrot_web/browser
        SERVER_CONFIG: nginx.conf
        APP_PORT: "10700"
    ports: !override
      - "127.0.0.1:${PARROT_WEB_HOST_PORT:-10700}:${PARROT_WEB_CONTAINER_PORT:-10700}"
