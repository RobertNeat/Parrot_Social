server {
    listen 10700;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Runtime API base URL: rendered from PARROT_API_PUBLIC_ORIGIN by nginx's own
    # envsubst-on-templates entrypoint (this file is copied to
    # /etc/nginx/templates/default.conf.template, not conf.d/ directly), so one built
    # image works on any host without a rebuild. Read by environment.prod.ts via
    # index.html's <script src="env.js">.
    location = /env.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        return 200 'window.__env = { apiUrl: "${PARROT_API_PUBLIC_ORIGIN}" };';
    }
}
