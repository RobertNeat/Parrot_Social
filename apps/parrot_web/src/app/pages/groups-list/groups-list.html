<div class="groups-toolbar">
  @if (!formOpen()) {
    <button type="button" class="btn btn-primary" (click)="openForm()">
      <span class="material-symbols-outlined">add_circle</span>
      Create group
    </button>
  }
</div>

@if (formOpen()) {
  <div class="group-form panel">
    <h3>Create group</h3>
    <input class="input" type="text" placeholder="Name" [(ngModel)]="name" />
    <textarea class="input" rows="3" placeholder="Description" [(ngModel)]="description"></textarea>
    @if (error()) {
      <p class="form-error">{{ error() }}</p>
    }
    <div class="form-actions">
      <button type="button" class="btn btn-outline-gradient" (click)="cancelForm()">Cancel</button>
      <button
        type="button"
        class="btn btn-primary"
        [disabled]="submitting()"
        (click)="submit()"
      >
        {{ submitting() ? 'Creating...' : 'Create' }}
      </button>
    </div>
  </div>
}

<div class="groups-grid">
  @for (group of groupsService.groups(); track group.id) {
    <a class="group-card panel" [routerLink]="['/groups', group.id]">
      <div class="group-avatar">
        <span class="material-symbols-outlined">groups</span>
      </div>
      <div class="group-info">
        <h3>{{ group.name }}</h3>
        <p>{{ group.description }}</p>
        <span class="member-count">{{ group.memberCount }} members</span>
      </div>
      <button
        type="button"
        class="btn"
        [class.btn-primary]="!group.joined"
        [class.btn-outline-gradient]="group.joined"
        (click)="toggle(group.id, $event)"
      >
        <span class="material-symbols-outlined">{{
          group.joined ? 'remove_circle' : 'add_circle'
        }}</span>
        {{ group.joined ? 'Leave' : 'Join' }}
      </button>
    </a>
  }
</div>
