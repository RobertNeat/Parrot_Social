<div class="groups-grid">
  @for (group of groupsService.groups(); track group.id) {
    <a class="group-card panel" [routerLink]="['/groups', group.id]">
      <div class="group-avatar"></div>
      <div class="group-info">
        <h3>{{ group.name }}</h3>
        <p>{{ group.description }}</p>
        <span class="member-count">{{ group.memberCount }} members</span>
      </div>
      <button
        type="button"
        class="btn"
        [class.btn-primary]="!group.joined"
        [class.btn-outline-gradient]="group.joined"
        (click)="toggle(group.id, $event)"
      >
        <span class="material-symbols-outlined">{{
          group.joined ? 'remove_circle' : 'add_circle'
        }}</span>
        {{ group.joined ? 'Leave' : 'Join' }}
      </button>
    </a>
  }
</div>
