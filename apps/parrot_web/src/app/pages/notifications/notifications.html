<div class="notifications-page panel">
  <header class="notifications-header">
    <h1>Notifications</h1>
    <button type="button" class="btn btn-outline-gradient" (click)="notifications.markAllRead()">
      Mark all read
    </button>
  </header>

  <ul class="notification-list">
    @for (notification of notifications.notifications(); track notification.id) {
      <li class="notification-item" [class.unread]="!notification.read">
        <span class="material-symbols-outlined">{{ notification.icon }}</span>
        <span class="notification-text">{{ notification.text }}</span>
        <span class="time-ago">{{ notification.timeAgo }}</span>
      </li>
    }
  </ul>
</div>
