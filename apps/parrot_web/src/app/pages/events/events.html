<div class="events-toolbar">
  @if (!formOpen()) {
    <button type="button" class="btn btn-primary" (click)="openForm()">
      <span class="material-symbols-outlined">add_circle</span>
      Create event
    </button>
  }
</div>

@if (formOpen()) {
  <div class="event-form panel">
    <h3>Create event</h3>
    <input class="input" type="text" placeholder="Title" [(ngModel)]="title" />
    <textarea class="input" rows="3" placeholder="Description" [(ngModel)]="description"></textarea>
    <input class="input" type="datetime-local" [(ngModel)]="startsAt" />
    <input class="input" type="file" accept="image/*" (change)="onImageSelected($event)" />
    @if (error()) {
      <p class="form-error">{{ error() }}</p>
    }
    <div class="form-actions">
      <button type="button" class="btn btn-outline-gradient" (click)="cancelForm()">Cancel</button>
      <button
        type="button"
        class="btn btn-primary"
        [disabled]="submitting()"
        (click)="submit()"
      >
        {{ submitting() ? 'Creating...' : 'Create' }}
      </button>
    </div>
  </div>
}

<div class="events-grid">
  @for (event of eventsService.events(); track event.id) {
    <article class="event-card panel">
      <img class="event-image" [src]="event.imageUrl" [alt]="event.title" />
      <h3>{{ event.title }}</h3>
      <p class="event-desc">{{ event.description }}</p>
      <p class="interested-count">{{ event.interestedCount }} people interested</p>
      <button
        type="button"
        class="btn interest-btn"
        [class.btn-primary]="event.interested"
        [class.btn-outline-gradient]="!event.interested"
        (click)="toggle(event.id)"
      >
        <span class="material-symbols-outlined">{{
          event.interested ? 'check_circle' : 'cancel'
        }}</span>
        {{ event.interested ? 'Interested' : 'Uninterested' }}
      </button>
    </article>
  }
</div>
